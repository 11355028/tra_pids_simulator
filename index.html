<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台鐵大廳 PIDS 廣播模擬系統</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #111; color: #ffffff; margin: 0; padding: 20px; }
        h1, h2, h3 { color: #00d2ff; margin-top: 0; }
        h1 { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .container { max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }
        .control-panel { background-color: #222; padding: 20px; border-radius: 10px; border: 1px solid #444; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap:10px; }
        .train-input-row { display: flex; gap: 8px; background: #252525; padding: 8px; margin-bottom: 6px; border-radius: 4px; align-items: center; }
        .form-group { display: flex; flex-direction: column; gap: 2px; }
        .form-group label { font-size: 11px; color: #aaa; }
        input, select { background: #000; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 4px; font-size: 13px; }
        button { background: #0066cc; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:hover { background: #0088ff; }
        .jump-btn { background: #ff6600; }
        .jump-btn:hover { background: #ff8833; }
        .station-pids { background-color: #000; border: 6px solid #3c3c3c; border-radius: 10px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .pids-header { display: flex; justify-content: space-between; color: #00ff00; font-size: 22px; font-weight: bold; border-bottom: 2px dashed #444; padding-bottom: 12px; margin-bottom: 20px; }
        .pids-table { width: 100%; border-collapse: collapse; text-align: center; table-layout: fixed; }
        .pids-table th { color: #777; font-size: 14px; padding-bottom: 10px; border-bottom: 1px solid #222;}
        .pids-table td { font-size: 28px; font-weight: bold; padding: 16px 2px; }
        .c-destination { color: #ffaa00; } .c-time { color: #ffaa00; } .c-platform { color: #ff0000; }
        .log-box { background: #000; border: 1px solid #333; padding: 10px; height: 110px; overflow-y: auto; font-family: monospace; color: #4CAF50; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚉 台鐵大廳 PIDS 與新廣播模擬系統</h1>
    
    <div class="control-panel">
        <div class="panel-header">
            <h2>⚙️ 車站核心控制大廳</h2>
            <div style="display:flex; gap:10px; align-items:center;">
                <button class="jump-btn" onclick="goToTHSR()">🔄 切換至高鐵看板系統</button>
                <input type="time" id="sysTime" value="14:00" onchange="updateSystemTime()">
                <button onclick="triggerStationBroadcastCheck()">手動廣播測試</button>
            </div>
        </div>
        
        <div style="display:flex; flex-direction:column; gap:15px;">
            <div style="background:#1e1e1e; padding:15px; border-radius:8px;">
                <h3>⬇️ 逆行 / 南下 列車設定</h3>
                <div id="south_placeholder"></div>
            </div>
        </div>
        <button onclick="updateData()" style="width:100%; margin-top:10px;">儲存並排程台鐵資訊</button>
    </div>

    <div class="station-pids">
        <div class="pids-header">
            <div>本站：台北 STATION: TAIPEI</div>
            <div id="pids-clock">目前時間 14:00</div>
        </div>
        <table class="pids-table">
            <thead>
                <tr>
                    <th style="width:10%">車次</th><th style="width:20%">車種</th><th style="width:15%">經由</th><th style="width:15%">目的地</th><th style="width:15%">時間</th><th style="width:10%">月台</th><th style="width:15%">狀態</th>
                </tr>
            </thead>
            <tbody id="pids-body"></tbody>
        </table>
    </div>
    <div class="log-box" id="logBox">台鐵廣播核心系統準備就緒。</div>
</div>

<script>
    let voices = [];
    
    // 完美跳轉高鐵專案
    function goToTHSR() { 
        window.location.href = "https://11355028.github.io/thsr-pids-simulator/"; 
    }

    function generateFields() {
        document.getElementById('south_placeholder').innerHTML = `
            <div class="train-input-row">
                <div class="form-group"><label>車次</label><input type="text" id="num" value="115" style="width:50px;"></div>
                <div class="form-group"><label>車種(英)</label><input type="text" id="typeEn" value="Tze-Chiang" style="width:100px;"></div>
                <div class="form-group"><label>經由(英)</label><input type="text" id="viaEn" value="Mountain" style="width:90px;"></div>
                <div class="form-group"><label>時間</label><input type="time" id="time" value="14:05"></div>
                <div class="form-group"><label>目的(中)</label><input type="text" id="dest" value="屏東" style="width:60px;"></div>
                <div class="form-group"><label>目的(英)</label><input type="text" id="destEn" value="Pingtung" style="width:90px;"></div>
                <div class="form-group"><label>月台</label><input type="text" id="plat" value="1A" style="width:40px;"></div>
            </div>
        `;
    }

    function updateData() {
        const tbody = document.getElementById('pids-body');
        tbody.innerHTML = `<tr>
            <td>${document.getElementById('num').value}</td>
            <td><span style="color:red;">自強</span></td>
            <td><span style="color:green;">山線</span></td>
            <td><span class="c-destination">${document.getElementById('dest').value}</span></td>
            <td><span class="c-time">${document.getElementById('time').value}</span></td>
            <td><span class="c-platform">${document.getElementById('plat').value}</span></td>
            <td><span style="color:green;">準點</span></td>
        </tr>`;
    }

    function executeBroadcast() {
        if (!('speechSynthesis' in window)) return;
        const timeVal = document.getElementById('time').value;
        const tp = timeVal.split(':');
        const brokenNum = document.getElementById('num').value.split('').join(' ');
        
        let platStr = document.getElementById('plat').value;
        let platEn = `Platform ${platStr}`;
        const match = platStr.match(/^(\d+)([A-Ba-b])$/);
        if (match) platEn = `Platform ${match[1]}, ${match[2].toUpperCase()} side`;

        // 雙語播音處理
        let zh = `各位旅客您好，${tp[0]}點${tp[1]}分，經由山線開往${document.getElementById('dest').value}，${brokenNum}次自強號，請到第${platStr}月台候車。`;
        let en = `Ladies and gentlemen, here have your attention please. ${timeVal}, ${document.getElementById('viaEn').value} Line, passengers to ${document.getElementById('destEn').value}, train number ${brokenNum}, ${document.getElementById('typeEn').value}, ${platEn}, boarding.`;

        const box = document.getElementById('logBox');
        box.innerHTML += `<br>[${document.getElementById('sysTime').value}] 📢 新台鐵官方廣播已完成模擬推播。`;
        
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(zh));
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(en));
    }

    function triggerStationBroadcastCheck() { executeBroadcast(); }
    function updateSystemTime() { document.getElementById('pids-clock').innerText = `目前時間 ${document.getElementById('sysTime').value}`; }

    document.addEventListener("DOMContentLoaded", () => {
        generateFields(); updateData();
        if ('speechSynthesis' in window) voices = window.speechSynthesis.getVoices();
    });
</script>
</body>
</html>
